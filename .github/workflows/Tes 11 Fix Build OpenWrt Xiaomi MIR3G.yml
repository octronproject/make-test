name: Tes 11 Fix Build OpenWrt Xiaomi MIR3G

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: v21.02.7
            config_dir: openwrt-v21.02.7
          - tag: v22.03.6
            config_dir: openwrt-v22.03.6
          - tag: v23.05.6
            config_dir: openwrt-v23.05.6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check config folder
        id: cfg
        shell: bash
        run: |
          SRC="xiaomi-mir3g/${{ matrix.config_dir }}"
          if [ ! -d "$SRC" ]; then
            echo "CONFIG_FOUND=false" >> "$GITHUB_ENV"
            echo "Skip: $SRC not found"
            exit 0
          fi

          for f in ".config" "mt7621.mk" "mt7621_xiaomi_mi-router-3g.dts"; do
            if [ ! -f "$SRC/$f" ]; then
              echo "CONFIG_FOUND=false" >> "$GITHUB_ENV"
              echo "Skip: missing $SRC/$f"
              exit 0
            fi
          done

          echo "CONFIG_FOUND=true" >> "$GITHUB_ENV"

      - name: Skip invalid config
        if: env.CONFIG_FOUND == 'false'
        run: echo "Skip build for ${{ matrix.tag }}"

      - name: Fix Ubuntu apt sources
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list >/dev/null <<'EOF'
          deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-backports main restricted universe multiverse
          EOF

      - name: Install build tools
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget \
            python3 python3-setuptools

      - name: Clone OpenWrt
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git fetch --tags --force
          git checkout "${{ matrix.tag }}"

      - name: Apply custom configs
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          set -e
          SRC="xiaomi-mir3g/${{ matrix.config_dir }}"
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cd ..

          mkdir -p openwrt/target/linux/ramips/image openwrt/target/linux/ramips/dts
          cp -f "$SRC/mt7621.mk" openwrt/target/linux/ramips/image/mt7621.mk
          cp -f "$SRC/mt7621_xiaomi_mi-router-3g.dts" \
            openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts

          if [ -f "$SRC/01_leds" ]; then
            cp -f "$SRC/01_leds" openwrt/target/linux/ramips/mt7621/base-files/etc/board.d/01_leds
          fi

          if [ -f "$SRC/02_network" ]; then
            cp -f "$SRC/02_network" openwrt/target/linux/ramips/mt7621/base-files/etc/board.d/02_network
          fi

          cp -f "$SRC/.config" openwrt/.config
          sed -i \
            -e '/CONFIG_PACKAGE_kmod-fs-nfs/d' \
            -e '/CONFIG_PACKAGE_wpad/d' \
            -e '/CONFIG_PACKAGE_wolfssl/d' \
            -e '/libustream-wolfssl/d' \
            -e '/wpad-basic-wolfssl/d' \
            -e '/CONFIG_PACKAGE_uhttpd/d' \
            -e '/CONFIG_PACKAGE_luci-ssl-nginx/d' \
            -e '/CONFIG_PACKAGE_nginx/d' \
            openwrt/.config

          cat <<'EOF' >> openwrt/.config
          CONFIG_PACKAGE_libopenssl=y
          CONFIG_PACKAGE_libustream-openssl=y
          CONFIG_PACKAGE_wpad-basic-openssl=y
          CONFIG_PACKAGE_luci-ssl-nginx=y
          CONFIG_PACKAGE_nginx-ssl=y
          EOF

          cd openwrt
          make defconfig

      - name: Build
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          cd openwrt
          make download -j"$(nproc)"
          make -j"$(nproc)" FORCE_UNSAFE_CONFIGURE=1 || \
            make -j1 V=s FORCE_UNSAFE_CONFIGURE=1

      - name: Upload artifact
        if: env.CONFIG_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ matrix.tag }}-MIR3G
          path: openwrt/bin/targets/
          if-no-files-found: error
