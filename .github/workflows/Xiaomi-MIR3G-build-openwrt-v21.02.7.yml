name: Build OpenWrt v21.02.7 Xiaomi-MIR3G

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
        
    - name: Install Prerequisites inside Container
      env:
          DEBIAN_FRONTEND: noninteractive
      run: |
          	apt-get update
          	apt-get install -y build-essential clang flex g++ gawk gcc-multilib \
            git gettext libncurses5-dev libssl-dev python3-pip python3-dev \
            python3-setuptools rsync unzip zlib1g-dev swig wget file time morse

          	git clone https://github.com/openwrt/openwrt.git
          	cd openwrt
          	git pull
          	git checkout v21.02.7
            
      	     ./scripts/feeds update -a
             ./scripts/feeds install -a
        	  
          set -e
        	cp xiaomi-mir3g/fullconfig/openwrt-v21.02.7/.config openwrt/.config
        	cp xiaomi-mir3g/fullconfig/openwrt-v21.02.7/mt7621.mk openwrt/target/linux/ramips/image/mt7621.mk
        	cp xiaomi-mir3g/fullconfig/openwrt-v21.02.7/mt7621_xiaomi_mi-router-3g.dts openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts
        	  
          make defconfig
        	
        	make download -j$(nproc)
        	find dl -size 0 -exec rm -f {} \;
        	
        	make -j$(nproc) world || make -j1 V=s world
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
          name: OpenWrt_21.02.7_MIR3G_${{ env.BUILD_DATE }}
          path: openwrt/bin
