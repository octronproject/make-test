name: Build OpenWrt Matrix Specific Config (Xiaomi MIR3G)

on:
  workflow_dispatch:
  push:
    paths:
      - 'xiaomi-mir3g/fullconfig/**'

jobs:
  build_firmware:
    name: Build OpenWrt ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - openwrt-21.02
          - openwrt-22.03
          - openwrt-23.05
    
    container: ${{ matrix.version == 'openwrt-21.02' && 'ubuntu:20.04' || null }}

    steps:
      - name: Install Git & Sudo di Container (Khusus Ubuntu Lawas/Docker v21)
        if: matrix.version == 'openwrt-21.02'
        run: |
          apt-get update
          apt-get install -y git sudo cpio

      - name: Checkout Repositori
        uses: actions/checkout@v4

      - name: Setup Lingkungan OS (Install Dependencies)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 1. Paksa set timezone ke UTC agar tzdata tidak memunculkan prompt interaktif
          sudo ln -fs /usr/share/zoneinfo/UTC /etc/localtime
          
          # 2. Jika berjalan langsung di runner host biasa (bukan container v21), bersihkan ruang disk
          if [ -z "${{ job.container.id }}" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          fi
          
          sudo apt-get update
          
          # 3. Kumpulkan dependensi dasar standar OpenWrt
          PACKAGES="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget python3"
          
          # 4. Solusi Python Distutils dinamis: Pasang python3-distutils HANYA JIKA paketnya tersedia di Ubuntu tersebut
          if apt-cache show python3-distutils >/dev/null 2>&1; then
            PACKAGES="$PACKAGES python3-distutils"
          else
            # Untuk Ubuntu versi baru yang menghilangkan distutils, gunakan python3-setuptools sebagai pengganti
            PACKAGES="$PACKAGES python3-setuptools"
          fi
          
          sudo apt-get install -y $PACKAGES

      - name: Clone Source Code OpenWrt
        run: |
          git clone -b ${{ matrix.version }} https://github.com openwrt

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Terapkan Konfigurasi Spesifik Versi
        run: |
          cp xiaomi-mir3g/fullconfig/${{ matrix.version }}.config openwrt/.config
          cd openwrt
          make defconfig

      - name: Download Source Package
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Proses Kompilasi Firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread CPU digunakan untuk compile."
          make -j$(nproc) FORCE_UNSAFE_CONFIGURE=1 || make -j1 V=s FORCE_UNSAFE_CONFIGURE=1

      - name: Kelompokkan Hasil Build
        run: |
          mkdir -p ./output
          find openwrt/bin/targets/ -type f -name "*mir3g*" -o -name "*sysupgrade*" | xargs -I {} cp {} ./output/
          echo "Daftar file hasil build yang siap diunduh:"
          ls -lh ./output

      - name: Upload Artifacts Ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ matrix.version }}-Xiaomi-MIR3G
          path: ./output/
