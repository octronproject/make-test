name: Build OpenWrt Matrix Specific Config (Xiaomi MIR3G)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt version to build"
        required: true
        default: "21.02.7"
        type: choice
        options:
          - "21.02.7"
          - "22.03.6"
          - "23.05.6"

jobs:
  build:
    name: OpenWrt ${{ github.event.inputs.version }} - Xiaomi MIR3G
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
      FORCE_UNSAFE_CONFIGURE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version mapping
        id: version_map
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          case "$VERSION" in
            "21.02.7")
              echo "openwrt_branch=v21.02.7" >> $GITHUB_ENV
              echo "config_dir=xiaomi-mir3g/fullconfig/openwrt-v21.02.7" >> $GITHUB_ENV
              ;;
            "22.03.6")
              echo "openwrt_branch=v22.03.6" >> $GITHUB_ENV
              echo "config_dir=xiaomi-mir3g/fullconfig/openwrt-v22.03.6" >> $GITHUB_ENV
              ;;
            "23.05.6")
              echo "openwrt_branch=v23.05.6" >> $GITHUB_ENV
              echo "config_dir=xiaomi-mir3g/fullconfig/openwrt-v23.05.6" >> $GITHUB_ENV
              ;;
            *)
              echo "Unsupported version: $VERSION"
              exit 1
              ;;
          esac

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            swig \
            wget \
            file \
            time \
            ca-certificates \
            curl \
            patch \
            quilt

      - name: Clone OpenWrt source
        shell: bash
        run: |
          git clone --depth 1 --branch "${openwrt_branch}" https://github.com/openwrt/openwrt.git openwrt

      - name: Copy version-specific config, mt7621.mk, and DTS
        shell: bash
        run: |
          set -eux

          CONFIG_DIR="${config_dir}"

          test -f "${CONFIG_DIR}/.config"
          test -f "${CONFIG_DIR}/mt7621.mk"
          test -f "${CONFIG_DIR}/mt7621_xiaomi_mi-router-3g.dts"

          cp "${CONFIG_DIR}/.config" openwrt/.config

          mkdir -p openwrt/target/linux/ramips/image
          mkdir -p openwrt/target/linux/ramips/dts

          cp "${CONFIG_DIR}/mt7621.mk" openwrt/target/linux/ramips/image/mt7621.mk
          cp "${CONFIG_DIR}/mt7621_xiaomi_mi-router-3g.dts" openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts

          echo "Files copied:"
          ls -l openwrt/.config
          ls -l openwrt/target/linux/ramips/image/mt7621.mk
          ls -l openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts

      - name: Update feeds and configure OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          set -eux
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Download sources
        working-directory: openwrt
        shell: bash
        run: |
          set -eux
          make download -j"$(nproc)"

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -eux
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Collect build output
        shell: bash
        run: |
          mkdir -p output
          find openwrt/bin/targets -type f -exec cp -t output {} +
          echo "Build artifacts:"
          ls -lh output

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ github.event.inputs.version }}-Xiaomi-MIR3G
          path: output/
