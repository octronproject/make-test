name: coba 2 OpenWrt Matrix Build Xiaomi MIR3G (Safe Version)

on:
  workflow_dispatch:

jobs:
  build_firmware:
    name: Build OpenWrt ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: v21.02.7
            config_dir: xiaomi-mir3g-openwrt-v21.02.7
            container: ubuntu:20.04
            use_container: true

          - tag: v22.03.6
            config_dir: xiaomi-mir3g-openwrt-v22.03.6
            container: ubuntu:20.04
            use_container: true

          - tag: v23.05.6
            config_dir: xiaomi-mir3g-openwrt-v23.05.6
            container: ""
            use_container: false

    container: ${{ matrix.use_container && matrix.container || null }}

    steps:
      - name: Cek folder konfigurasi versi
        id: check_config
        shell: bash
        run: |
          SRC="${{ matrix.config_dir }}"
          if [ ! -d "$SRC" ]; then
            echo "Folder konfigurasi tidak ditemukan: $SRC"
            echo "CONFIG_FOUND=false" >> "$GITHUB_ENV"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Folder konfigurasi ditemukan: $SRC"
          echo "CONFIG_FOUND=true" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Skip build jika folder config tidak ada
        if: ${{ env.CONFIG_FOUND == 'false' }}
        shell: bash
        run: |
          echo "Melewati build untuk ${{ matrix.tag }} karena folder konfigurasi tidak ditemukan: ${{ matrix.config_dir }}"

      - name: Install Git & Sudo di Container (Khusus Ubuntu Lawas)
        if: ${{ env.CONFIG_FOUND != 'false' && matrix.tag == 'v21.02.7' }}
        shell: bash
        run: |
          apt-get update
          apt-get install -y git sudo cpio

      - name: Checkout Repositori
        if: ${{ env.CONFIG_FOUND != 'false' }}
        uses: actions/checkout@v4

      - name: Setup Lingkungan OS (Install Dependencies)
        if: ${{ env.CONFIG_FOUND != 'false' }}
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          if [ "${{ matrix.use_container }}" = "true" ]; then
            ln -fs /usr/share/zoneinfo/UTC /etc/localtime
            apt-get update
          else
            sudo ln -fs /usr/share/zoneinfo/UTC /etc/localtime
            sudo apt-get update
          fi

          PACKAGES="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget \
            python3 python3-setuptools"

          if [ "${{ matrix.use_container }}" = "true" ]; then
            apt-get install -y $PACKAGES
          else
            sudo apt-get install -y $PACKAGES
          fi

      - name: Clone Source Code OpenWrt
        if: ${{ env.CONFIG_FOUND != 'false' }}
        shell: bash
        run: |
          git clone --depth 1 --branch ${{ matrix.tag }} https://github.com/openwrt/openwrt.git openwrt

      - name: Update & Install Feeds
        if: ${{ env.CONFIG_FOUND != 'false' }}
        shell: bash
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Terapkan Konfigurasi Spesifik Versi
        if: ${{ env.CONFIG_FOUND != 'false' }}
        shell: bash
        run: |
          SRC="${{ matrix.config_dir }}"
          if [ ! -d "$SRC" ]; then
            echo "Folder konfigurasi tidak ditemukan: $SRC"
            exit 1
          fi

          # Copy file .config utama
          if [ -f "$SRC/.config" ]; then
            cp -f "$SRC/.config" openwrt/.config
          else
            echo "Peringatan: file .config tidak ditemukan di $SRC"
          fi

          # Copy semua file .mk dan .dts dari folder versi
          shopt -s nullglob
          for f in "$SRC"/*.mk "$SRC"/*.dts; do
            cp -f "$f" openwrt/
          done

          # Validasi: pastikan minimal ada file yang dikopi
          if [ ! -f "openwrt/.config" ] && [ -z "$(find openwrt -maxdepth 1 -type f \( -name '*.mk' -o -name '*.dts' \) -print -quit)" ]; then
            echo "Tidak ada file .config/.mk/.dts yang ditemukan di $SRC"
            exit 1
          fi

          cd openwrt
          make defconfig

      - name: Download Source Package
        if: ${{ env.CONFIG_FOUND != 'false' }}
        shell: bash
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Proses Kompilasi Firmware
        if: ${{ env.CONFIG_FOUND != 'false' }}
        shell: bash
        run: |
          cd openwrt
          echo -e "$(nproc) thread CPU digunakan untuk compile."
          make -j$(nproc) FORCE_UNSAFE_CONFIGURE=1 || make -j1 V=s FORCE_UNSAFE_CONFIGURE=1

      - name: Kelompokkan Hasil Build per Target
        if: ${{ env.CONFIG_FOUND != 'false' }}
        shell: bash
        run: |
          mkdir -p "./output/${{ matrix.tag }}"
          find openwrt/bin/targets -type f -exec cp -f {} "./output/${{ matrix.tag }}/" \;

          echo "Daftar file hasil build yang siap diunduh:"
          ls -lh "./output/${{ matrix.tag }}"

      - name: Upload Artifact per Versi
        if: ${{ env.CONFIG_FOUND != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ matrix.tag }}-Xiaomi-MIR3G
          path: ./output/${{ matrix.tag }}/
          if-no-files-found: error
