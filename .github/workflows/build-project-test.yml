name: Build OpenWrt v21.02.7 Xiaomi Mi Router 3G Tes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    # Prevent parallel builds
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4
      
    - name: Set Build Date & Timezone
      run: |
        sudo timedatectl set-timezone "Asia/Jakarta"
        echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Clean & Install prerequisites
      run: |
        sudo docker rmi $(docker image ls -q) 2>/dev/null || true
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y purge azure-cli google-cloud-cli google-chrome-stable firefox powershell dotnet-sdk*
        sudo -E apt-get update
        sudo -E apt-get -y install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget ccache
        sudo -E apt-get autoremove --purge -y
        sudo -E apt-get clean

        - name: Clone OpenWrt v21.02.7
      run: |
        git clone https://github.com/openwrt/openwrt.git
        cd openwrt
        git pull
        git checkout v21.02.7

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: Apply custom files (Overwrite Config, DTS, MK)
      run: |
        set -e
        cp test/.config openwrt/.config
        cp test/mt7621.mk openwrt/target/linux/ramips/image/mt7621.mk
        cp test/mt7621_xiaomi_mi-router-3g-v1.dts openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g-v1.dts
        cd openwrt
        make defconfig
        
    - name: Download Package Source (Pre-download)
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size 0 -exec rm -f {} \;

    - name: Build firmware
      run: |
        cd openwrt
        JOBS=$(nproc || echo 2)
        echo "Using $JOBS parallel jobs"
        export CCACHE_DIR="$HOME/.ccache"
        mkdir -p "$CCACHE_DIR"
        echo "Clearing old ccache..."
        ccache -C || true
        ccache -M 2G || true
        export PIP_BREAK_SYSTEM_PACKAGES=1
        time make -j"$JOBS" world || make -j1 V=s world
        echo "✓ Build finished"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_21.02.7_Xiaomi_Mi_Router_3G_v1_${{ env.BUILD_DATE }}
        path: openwrt/bin
