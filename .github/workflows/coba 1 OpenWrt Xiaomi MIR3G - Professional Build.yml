name: coba 1 OpenWrt Xiaomi MIR3G - Professional Build

on:
  workflow_dispatch:

env:
  BUILD_ROOT: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  DEBIAN_FRONTEND: noninteractive

jobs:
  build_v21027:
    name: Build OpenWrt v21.02.7
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate config directory exists
        id: config_check
        shell: bash
        run: |
          SRC="xiaomi-mir3g/openwrt-v21.02.7"
          if [ ! -d "$SRC" ]; then
            echo "CONFIG_FOUND=false" >> "$GITHUB_ENV"
            echo "Folder konfigurasi tidak ditemukan: $SRC"
            exit 0
          fi

          for f in ".config" "mt7621.mk" "mt7621_xiaomi_mi-router-3g.dts"; do
            if [ ! -f "$SRC/$f" ]; then
              echo "CONFIG_FOUND=false" >> "$GITHUB_ENV"
              echo "File tidak ditemukan: $SRC/$f"
              exit 0
            fi
          done

          echo "CONFIG_FOUND=true" >> "$GITHUB_ENV"
          echo "Folder dan file konfigurasi valid ditemukan di $SRC"

      - name: Skip if config invalid
        if: env.CONFIG_FOUND == 'false'
        run: echo "Skip build v21.02.7 karena konfigurasi tidak valid."

      - name: Install system dependencies
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          if [ "$(id -u)" -ne 0 ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
              gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget \
              python3 python3-setuptools ccache
          else
            apt-get update
            apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
              gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget \
              python3 python3-setuptools ccache
          fi

      - name: Cache ccache
        if: env.CONFIG_FOUND == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            openwrt/.ccache
          key: openwrt-v21.02.7-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            openwrt-v21.02.7-ccache-${{ runner.os }}-
            openwrt-v21.02.7-ccache-

      - name: Cache OpenWrt downloads
        if: env.CONFIG_FOUND == 'true'
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.config
          key: openwrt-v21.02.7-downloads-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            openwrt-v21.02.7-downloads-${{ runner.os }}-

      - name: Clone OpenWrt source
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v21.02.7 https://github.com/openwrt/openwrt.git openwrt

      - name: Apply custom MIR3G config
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          SRC="xiaomi-mir3g/openwrt-v21.02.7"

          mkdir -p openwrt/target/linux/ramips/image openwrt/target/linux/ramips/dts

          cp -f "$SRC/.config" openwrt/.config
          cp -f "$SRC/mt7621.mk" openwrt/target/linux/ramips/image/mt7621.mk
          cp -f "$SRC/mt7621_xiaomi_mi-router-3g.dts" openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts

          cd openwrt
          make defconfig

      - name: Update feeds
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download sources
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          cd openwrt
          make download -j"$(nproc)"
          find dl -size -1024c -exec ls -l {} \; 2>/dev/null || true
          find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true

      - name: Compile firmware
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        env:
          PATH: /usr/lib/ccache:$PATH
        run: |
          cd openwrt
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export PATH="/usr/lib/ccache:$PATH"
          ccache -z
          make -j"$(nproc)" FORCE_UNSAFE_CONFIGURE=1 || make -j1 V=s FORCE_UNSAFE_CONFIGURE=1
          ccache -s

      - name: Collect build artifacts
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          mkdir -p output/v21.02.7
          find openwrt/bin/targets -type f -exec cp -f {} output/v21.02.7/ \;
          echo "Artifacts:"
          ls -lh output/v21.02.7

      - name: Upload artifact
        if: env.CONFIG_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-v21.02.7-Xiaomi-MIR3G
          path: output/v21.02.7/
          if-no-files-found: error

