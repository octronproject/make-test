name: coba 1 OpenWrt Xiaomi MIR3G - Safe Matrix Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: v21.02.7
            config_dir: openwrt-v21.02.7
          - tag: v22.03.6
            config_dir: openwrt-v22.03.6
          - tag: v23.05.6
            config_dir: openwrt-v23.05.6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate source config
        id: cfg
        shell: bash
        run: |
          set -uo pipefail
          SRC="xiaomi-mir3g/${{ matrix.config_dir }}"
          required_files=(".config" "mt7621.mk" "mt7621_xiaomi_mi-router-3g.dts")
          errors=()

          echo "Validating OpenWrt ${{ matrix.tag }} config at: $SRC"
          if [[ ! -d "$SRC" ]]; then
            echo "::warning title=Config directory missing::Cannot build ${{ matrix.tag }}: directory '$SRC' does not exist. This matrix entry will be skipped."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for file in "${required_files[@]}"; do
            if [[ ! -s "$SRC/$file" ]]; then
              errors+=("Missing or empty required file: $SRC/$file")
            else
              echo "Found required file: $SRC/$file"
            fi
          done

          if [[ -s "$SRC/.config" ]]; then
            if ! grep -qx 'CONFIG_TARGET_ramips=y' "$SRC/.config"; then
              errors+=(".config does not enable CONFIG_TARGET_ramips=y")
            fi
            if ! grep -qx 'CONFIG_TARGET_ramips_mt7621=y' "$SRC/.config"; then
              errors+=(".config does not enable CONFIG_TARGET_ramips_mt7621=y")
            fi
            if ! grep -qx 'CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y' "$SRC/.config"; then
              errors+=(".config does not select the Xiaomi Mi Router 3G target device")
            fi
          fi

          if (( ${#errors[@]} > 0 )); then
            echo "::warning title=Invalid config::${{ matrix.tag }} config validation failed; this matrix entry will be skipped. See the messages below."
            printf '::error::%s\n' "${errors[@]}"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Source config validation passed for ${{ matrix.tag }}."
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Report skipped config
        if: steps.cfg.outputs.valid != 'true'
        run: echo "Skipping ${{ matrix.tag }} because its source config directory or required config files/settings are missing or invalid. See the Validate source config step for details."

      - name: Install build dependencies
        if: steps.cfg.outputs.valid == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget \
            python3 python3-setuptools ccache

      - name: Restore ccache
        if: steps.cfg.outputs.valid == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-openwrt-${{ matrix.tag }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-openwrt-${{ matrix.tag }}-${{ runner.os }}-

      - name: Clone OpenWrt
        if: steps.cfg.outputs.valid == 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch ${{ matrix.tag }} https://github.com/openwrt/openwrt.git openwrt

      - name: Apply and validate OpenWrt config
        if: steps.cfg.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SRC="xiaomi-mir3g/${{ matrix.config_dir }}"
          mkdir -p openwrt/target/linux/ramips/image openwrt/target/linux/ramips/dts

          cp -f "$SRC/.config" openwrt/.config
          cp -f "$SRC/mt7621.mk" openwrt/target/linux/ramips/image/mt7621.mk
          cp -f "$SRC/mt7621_xiaomi_mi-router-3g.dts" openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts
          echo "Copied $SRC/.config to openwrt/.config"
          cmp -s "$SRC/.config" openwrt/.config || { echo "Copied .config does not match source config"; exit 1; }
          echo "Verified .config copy."

          for pkg in kmod-fs-nfs-common kmod-fs-nfs-common-rpcsec kmod-fs-nfsd; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=" openwrt/.config; then
              sed -i "/^CONFIG_PACKAGE_${pkg}=/d" openwrt/.config
              echo "Removed unused CONFIG_PACKAGE_${pkg} selection."
            else
              echo "No NFS selection found for ${pkg}."
            fi
          done

          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

          echo "Validating resolved OpenWrt config after make defconfig..."
          grep -qx 'CONFIG_TARGET_ramips=y' .config || { echo "Invalid resolved config: CONFIG_TARGET_ramips=y is absent"; exit 1; }
          grep -qx 'CONFIG_TARGET_ramips_mt7621=y' .config || { echo "Invalid resolved config: CONFIG_TARGET_ramips_mt7621=y is absent"; exit 1; }
          grep -qx 'CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y' .config || { echo "Invalid resolved config: Xiaomi Mi Router 3G target is not selected"; exit 1; }

          if grep -Eq '^CONFIG_PACKAGE_kmod-fs-nfs-(common|common-rpcsec|nfsd)=(y|m)$' .config; then
            echo "Invalid resolved config: NFS packages remain selected, but NFS is not needed."
            grep -E '^CONFIG_PACKAGE_kmod-fs-nfs-(common|common-rpcsec|nfsd)=' .config
            exit 1
          fi
          echo "Resolved config validation passed; unused NFS packages are not selected."

      - name: Build
        if: steps.cfg.outputs.valid == 'true'
        shell: bash
        run: |
          cd openwrt
          export PATH="/usr/lib/ccache:$PATH"
          ccache -z
          make download -j"$(nproc)"
          make -j"$(nproc)" FORCE_UNSAFE_CONFIGURE=1 || make -j1 V=s FORCE_UNSAFE_CONFIGURE=1
          ccache -s

      - name: Upload artifact
        if: steps.cfg.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ matrix.tag }}-MIR3G
          path: openwrt/bin/targets/
          if-no-files-found: error
