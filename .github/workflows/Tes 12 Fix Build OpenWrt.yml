name: Tes 12 Fix Build OpenWrt Xiaomi MIR3G

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: v21.02.7
            config_dir: openwrt-v21.02.7
          - tag: v22.03.6
            config_dir: openwrt-v22.03.6
          - tag: v23.05.6
            config_dir: openwrt-v23.05.6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check config folder
        id: cfg
        shell: bash
        run: |
          SRC="xiaomi-mir3g/${{ matrix.config_dir }}"
          if [ ! -d "$SRC" ]; then
            echo "CONFIG_FOUND=false" >> "$GITHUB_ENV"
            echo "Skip: $SRC not found"
            exit 0
          fi

          for f in ".config" "mt7621.mk" "mt7621_xiaomi_mi-router-3g.dts"; do
            if [ ! -f "$SRC/$f" ]; then
              echo "CONFIG_FOUND=false" >> "$GITHUB_ENV"
              echo "Skip: missing $SRC/$f"
              exit 0
            fi
          done

          echo "CONFIG_FOUND=true" >> "$GITHUB_ENV"

      - name: Skip invalid config
        if: env.CONFIG_FOUND == 'false'
        run: echo "Skip build for ${{ matrix.tag }}"

      - name: Prepare apt cache
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chmod -R a+rwX /var/cache/apt/archives

      - name: Cache apt archives
        if: env.CONFIG_FOUND == 'true'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-ubuntu-24.04-${{ hashFiles('.github/workflows/Tes 10 Fix Build OpenWrt Xiaomi MIR3G.yml') }}
          restore-keys: |
            apt-ubuntu-24.04-

      - name: Install build tools
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail

          # Fix broken Azure Ubuntu mirror issues
          sudo rm -f /etc/apt/apt-mirrors.txt

          # Point apt to the official Ubuntu mirrors
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget \
            python3 python3-setuptools

      - name: Debug environment on failure
        if: failure() && env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          echo '--- OS ---'
          uname -a || true
          cat /etc/os-release || true

          echo '--- DNS ---'
          getent hosts archive.ubuntu.com || true
          getent hosts security.ubuntu.com || true

          echo '--- APT sources ---'
          sudo grep -R -n -E '^(URIs:|Suites:|deb )|azure.archive.ubuntu.com|mirror\\+file:' \
            /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true

          echo '--- APT mirror file ---'
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo cat /etc/apt/apt-mirrors.txt
          else
            echo '/etc/apt/apt-mirrors.txt is absent'
          fi

          echo '--- Disk ---'
          df -h || true

      - name: Clone OpenWrt
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git fetch --tags --force
          git checkout "${{ matrix.tag }}"

      - name: Apply custom configs
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          set -e
          SRC="xiaomi-mir3g/${{ matrix.config_dir }}"

          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cd ..

          mkdir -p openwrt/target/linux/ramips/image openwrt/target/linux/ramips/dts
          cp -f "$SRC/mt7621.mk" openwrt/target/linux/ramips/image/mt7621.mk
          cp -f "$SRC/mt7621_xiaomi_mi-router-3g.dts" \
            openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts

          if [ -f "$SRC/01_leds" ]; then
            cp -f "$SRC/01_leds" openwrt/target/linux/ramips/mt7621/base-files/etc/board.d/01_leds
            echo "Custom 01_leds applied successfully."
          fi

          if [ -f "$SRC/02_network" ]; then
            cp -f "$SRC/02_network" openwrt/target/linux/ramips/mt7621/base-files/etc/board.d/02_network
            echo "Custom 02_network applied successfully."
          fi

          cp -f "$SRC/.config" openwrt/.config

          sed -i \
            -e '/CONFIG_PACKAGE_kmod-fs-nfs/d' \
            -e '/CONFIG_PACKAGE_wpad/d' \
            -e '/CONFIG_PACKAGE_wolfssl/d' \
            -e '/libustream-wolfssl/d' \
            -e '/wpad-basic-wolfssl/d' \
            -e '/CONFIG_PACKAGE_uhttpd/d' \
            -e '/CONFIG_PACKAGE_luci-ssl-nginx/d' \
            -e '/CONFIG_PACKAGE_nginx/d' \
            openwrt/.config

          cat <<'EOF' >> openwrt/.config
          # Matikan modul NFS
          # CONFIG_PACKAGE_kmod-fs-nfs is not set
          # CONFIG_PACKAGE_kmod-fs-nfs-common is not set
          # CONFIG_PACKAGE_kmod-fs-nfs-common-rpcsec is not set
          # CONFIG_PACKAGE_kmod-fs-nfsd is not set

          # Paksa matikan WolfSSL secara menyeluruh
          # CONFIG_PACKAGE_libwolfssl is not set
          # CONFIG_PACKAGE_libustream-wolfssl is not set
          # CONFIG_PACKAGE_wpad-wolfssl is not set
          # CONFIG_PACKAGE_wpad-basic-wolfssl is not set

          # Aktifkan OpenSSL dan paket pendukungnya
          CONFIG_PACKAGE_libopenssl=y
          CONFIG_PACKAGE_libustream-openssl=y
          CONFIG_PACKAGE_wpad-basic-openssl=y

          # Matikan Web Server uhttpd bawaan
          # CONFIG_PACKAGE_uhttpd is not set
          # CONFIG_PACKAGE_uhttpd-mod-ubus is not set

          # Aktifkan LuCI berbasis Nginx Pure dengan SSL (OpenSSL)
          CONFIG_PACKAGE_luci-ssl-nginx=y
          CONFIG_PACKAGE_nginx-ssl=y
          EOF

          cd openwrt
          make defconfig

      - name: Build
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          cd openwrt
          make download -j"$(nproc)"
          make -j"$(nproc)" FORCE_UNSAFE_CONFIGURE=1 || \
            make -j1 V=s FORCE_UNSAFE_CONFIGURE=1

      - name: Upload artifact
        if: env.CONFIG_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ matrix.tag }}-MIR3G
          path: openwrt/bin/targets/
          if-no-files-found: error
