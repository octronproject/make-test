name: coba 4 OpenWrt Xiaomi MIR3G - Safe Matrix Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: v21.02.7
            config_dir: openwrt-v21.02.7
          - tag: v22.03.6
            config_dir: openwrt-v22.03.6
          - tag: v23.05.6
            config_dir: openwrt-v23.05.6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check config
        id: cfg
        shell: bash
        run: |
          SRC="xiaomi-mir3g/${{ matrix.config_dir }}"
          if [ ! -d "$SRC" ]; then
            echo "CONFIG_FOUND=false" >> "$GITHUB_ENV"
            echo "Missing: $SRC"
            exit 0
          fi
          for f in ".config" "mt7621.mk" "mt7621_xiaomi_mi-router-3g.dts"; do
            if [ ! -f "$SRC/$f" ]; then
              echo "CONFIG_FOUND=false" >> "$GITHUB_ENV"
              echo "Missing: $SRC/$f"
              exit 0
            fi
          done
          echo "CONFIG_FOUND=true" >> "$GITHUB_ENV"

      - name: Skip invalid config
        if: env.CONFIG_FOUND == 'false'
        run: echo "Skip ${{ matrix.tag }}"

      - name: Install build dependencies
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget \
            python3 python3-setuptools ccache

      - name: Restore ccache
        if: env.CONFIG_FOUND == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-openwrt-${{ matrix.tag }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-openwrt-${{ matrix.tag }}-${{ runner.os }}-

      - name: Clone OpenWrt
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch ${{ matrix.tag }} https://github.com/openwrt/openwrt.git openwrt

      - name: Apply config
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          SRC="xiaomi-mir3g/${{ matrix.config_dir }}"
          mkdir -p openwrt/target/linux/ramips/image openwrt/target/linux/ramips/dts
          cp -f "$SRC/.config" openwrt/.config
          cp -f "$SRC/mt7621.mk" openwrt/target/linux/ramips/image/mt7621.mk
          cp -f "$SRC/mt7621_xiaomi_mi-router-3g.dts" openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Build
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          cd openwrt
          export PATH="/usr/lib/ccache:$PATH"
          ccache -z
          make download -j"$(nproc)"
          make -j"$(nproc)" FORCE_UNSAFE_CONFIGURE=1 || make -j1 V=s FORCE_UNSAFE_CONFIGURE=1
          ccache -s

      - name: Upload artifact
        if: env.CONFIG_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ matrix.tag }}-MIR3G
          path: openwrt/bin/targets/
          if-no-files-found: error
