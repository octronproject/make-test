name: Tes2 Build OpenWrt 22.03.7 - TL-MR3420 v2 - 16MB Flash

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      OPENWRT_VERSION: v22.03.7
      CONFIG_SOURCE: tl-mr3420v2/openwrt-22/.config
      DEVICE: tplink_tl-mr3420-v2

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-yaml \
            rsync unzip zlib1g-dev file wget \
            libelf-dev device-tree-compiler xsltproc \
            ca-certificates

      - name: Checkout configuration repository
        uses: actions/checkout@v4

      - name: Check custom OpenWrt config
        run: |
          if [ ! -s "$CONFIG_SOURCE" ]; then
            echo "::error::File konfigurasi tidak ditemukan atau kosong: $CONFIG_SOURCE"
            exit 1
          fi

      - name: Clone OpenWrt source and update feeds
        run: |
          git clone --depth 1 --branch "$OPENWRT_VERSION" \
            https://github.com/openwrt/openwrt.git openwrt

          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Move TL-MR3420 v2 profile to generic and set 16MB flash layout
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("openwrt")

          # Remove the original TL-MR3420 v2 profile from the tiny subtarget.
          tiny = root / "target/linux/ath79/image/tiny-tp-link.mk"
          text = tiny.read_text()

          pattern = re.compile(
              r"define Device/tplink_tl-mr3420-v2\n"
              r".*?"
              r"TARGET_DEVICES \+= tplink_tl-mr3420-v2\n?",
              re.S,
          )
          text, removed = pattern.subn("", text)
          if removed != 1:
              raise SystemExit(
                  f"Expected to remove one tiny profile; removed {removed}"
              )
          tiny.write_text(text)

          # Add the profile to generic, using OpenWrt's 16MB TP-Link image template.
          generic = root / "target/linux/ath79/image/generic-tp-link.mk"
          text = generic.read_text()

          if "define Device/tplink_tl-mr3420-v2" not in text:
              text += """
          define Device/tplink_tl-mr3420-v2
            $(Device/tplink-16mlzma)
            SOC := ar9341
            DEVICE_MODEL := TL-MR3420
            DEVICE_VARIANT := v2
            DEVICE_PACKAGES := kmod-usb2 kmod-usb-ledtrig-usbport
            TPLINK_HWID := 0x34200002
            SUPPORTED_DEVICES += tl-mr3420-v2
          endef
          TARGET_DEVICES += tplink_tl-mr3420-v2
          """
              generic.write_text(text)

          # Keep the upstream DTS and its existing device settings. Only enlarge
          # the firmware partition and move the ART partition for a 16MB flash.
          dts = root / "target/linux/ath79/dts/ar9341_tplink_tl-mr3420-v2.dts"
          text = dts.read_text()

          replacements = {
              "reg = <0x020000 0x3d0000>;":
                  "reg = <0x020000 0xfd0000>;",
              "partition@3f0000 {":
                  "partition@ff0000 {",
              "reg = <0x3f0000 0x010000>;":
                  "reg = <0xff0000 0x010000>;",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one occurrence of {old!r}; found {count}"
                  )
              text = text.replace(old, new)

          dts.write_text(text)
          print("Applied 16MB flash layout while preserving the upstream DTS.")
          PY

      - name: Configure OpenWrt
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/$CONFIG_SOURCE" .config

          # Remove stale target/profile selections from the saved config.
          sed -i -E \
            '/^(# )?CONFIG_TARGET_ath79(_[^ =]+)?(=| is not set)/d' \
            .config

          cat >> .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v2=y
          EOF

          # Normalize all options against this exact OpenWrt source and profile.
          make defconfig

          grep -qx 'CONFIG_TARGET_ath79=y' .config
          grep -qx 'CONFIG_TARGET_ath79_generic=y' .config
          grep -qx \
            'CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-mr3420-v2=y' \
            .config

      - name: Download build sources
        run: |
          cd openwrt
          make download -j2
          find dl -type f -size -1024c -print -delete

      - name: Build firmware
        run: |
          cd openwrt
          make -j2

      - name: Check firmware output
        if: success()
        run: |
          find openwrt/bin/targets/ath79/generic \
            -maxdepth 1 -type f \
            -name "*${DEVICE}*" -print

          if ! find openwrt/bin/targets/ath79/generic \
            -maxdepth 1 -type f \
            -name "*${DEVICE}*" | grep -q .; then
            echo "::error::Firmware TL-MR3420 v2 tidak ditemukan di direktori output."
            exit 1
          fi

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-22.03.7-TL-MR3420-v2-16MB
          path: openwrt/bin/targets/ath79/generic/*tplink_tl-mr3420-v2*
          if-no-files-found: error
          retention-days: 14
