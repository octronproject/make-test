name: coba 3 OpenWrt Xiaomi MIR3G - Optimized Cache

on:
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 3G

jobs:
  build_v21027:
    name: Build v21.02.7
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate config
        shell: bash
        run: |
          SRC="xiaomi-mir3g/openwrt-v21.02.7"
          if [ ! -d "$SRC" ]; then
            echo "CONFIG_FOUND=false" >> "$GITHUB_ENV"
            echo "Missing dir: $SRC"
            exit 0
          fi
          for f in ".config" "mt7621.mk" "mt7621_xiaomi_mi-router-3g.dts"; do
            if [ ! -f "$SRC/$f" ]; then
              echo "CONFIG_FOUND=false" >> "$GITHUB_ENV"
              echo "Missing file: $SRC/$f"
              exit 0
            fi
          done
          echo "CONFIG_FOUND=true" >> "$GITHUB_ENV"

      - name: Skip invalid config
        if: env.CONFIG_FOUND == 'false'
        run: echo "Skip v21.02.7"

      - name: Install packages
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget \
            python3 python3-setuptools ccache

      - name: Restore ccache
        if: env.CONFIG_FOUND == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-openwrt-v21.02.7-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-openwrt-v21.02.7-${{ runner.os }}-

      - name: Restore download cache
        if: env.CONFIG_FOUND == 'true'
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.config
          key: dl-openwrt-v21.02.7-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            dl-openwrt-v21.02.7-${{ runner.os }}-

      - name: Clone source
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: git clone --depth 1 --branch v21.02.7 https://github.com/openwrt/openwrt.git openwrt

      - name: Apply firmware config
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          SRC="xiaomi-mir3g/openwrt-v21.02.7"
          mkdir -p openwrt/target/linux/ramips/image openwrt/target/linux/ramips/dts
          cp -f "$SRC/.config" openwrt/.config
          cp -f "$SRC/mt7621.mk" openwrt/target/linux/ramips/image/mt7621.mk
          cp -f "$SRC/mt7621_xiaomi_mi-router-3g.dts" openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Download sources
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          cd openwrt
          make download -j"$(nproc)"
          find dl -size -1024c -exec ls -l {} \; 2>/dev/null || true
          find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true

      - name: Build with ccache
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          cd openwrt
          export PATH="/usr/lib/ccache:$PATH"
          ccache -z
          make -j"$(nproc)" FORCE_UNSAFE_CONFIGURE=1 || make -j1 V=s FORCE_UNSAFE_CONFIGURE=1
          ccache -s

      - name: Collect artifacts
        if: env.CONFIG_FOUND == 'true'
        shell: bash
        run: |
          mkdir -p output/v21.02.7
          find openwrt/bin/targets -type f -exec cp -f {} output/v21.02.7/ \;
          ls -lh output/v21.02.7

      - name: Upload artifact
        if: env.CONFIG_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-v21.02.7-MIR3G
          path: output/v21.02.7/
          if-no-files-found: error
