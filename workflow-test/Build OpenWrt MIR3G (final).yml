name: Build OpenWrt MIR3G (final)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    name: Discover build configs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover config folders
        id: set-matrix
        shell: bash
        run: |
          set -euxo pipefail

          mapfile -t dirs < <(find xiaomi-mir3g/fullconfig -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)

          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json='['
          for i in "${!dirs[@]}"; do
            d="${dirs[$i]}"
            version="${d#openwrt-}"
            tag="v${version}"
            if [[ "${version}" == "23.05.6" ]]; then
              image="ubuntu:22.04"
            else
              image="ubuntu:20.04"
            fi

            item=$(printf '{"version":"%s","tag":"%s","image":"%s"}' "${version}" "${tag}" "${image}")
            if [ "$i" -gt 0 ]; then
              json="${json},"
            fi
            json="${json}${item}"
          done
          json="${json}]"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    name: OpenWrt ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    container:
      image: ${{ matrix.image }}

    env:
      DEBIAN_FRONTEND: noninteractive
      FORCE_UNSAFE_CONFIGURE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/openwrt/dl
          key: openwrt-${{ matrix.version }}-${{ runner.os }}-${{ hashFiles('**/*.mk', '**/.config') }}
          restore-keys: |
            openwrt-${{ matrix.version }}-${{ runner.os }}-
            openwrt-${{ matrix.version }}-

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential clang flex g++ gawk gcc-multilib \
            git gettext libncurses5-dev libssl-dev python3-pip python3-dev \
            python3-setuptools rsync unzip zlib1g-dev swig wget file time \
            ca-certificates ccache

      - name: Set build date
        shell: bash
        run: echo "BUILD_DATE=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

      - name: Build OpenWrt
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/lib/ccache:${PATH}"

          if [ ! -d "${GITHUB_WORKSPACE}/openwrt" ]; then
            git clone https://github.com/openwrt/openwrt.git "${GITHUB_WORKSPACE}/openwrt"
          fi

          cd "${GITHUB_WORKSPACE}/openwrt"
          git fetch --all --tags --force
          git checkout "${{ matrix.tag }}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cp "${GITHUB_WORKSPACE}/xiaomi-mir3g/fullconfig/openwrt-v${{ matrix.version }}/.config" "${GITHUB_WORKSPACE}/openwrt/.config"
          cp "${GITHUB_WORKSPACE}/xiaomi-mir3g/fullconfig/openwrt-v${{ matrix.version }}/mt7621.mk" "${GITHUB_WORKSPACE}/openwrt/target/linux/ramips/image/mt7621.mk"
          cp "${GITHUB_WORKSPACE}/xiaomi-mir3g/fullconfig/openwrt-v${{ matrix.version }}/mt7621_xiaomi_mi-router-3g.dts" "${GITHUB_WORKSPACE}/openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts"

          make defconfig
          make download -j"$(nproc)"
          find dl -size 0 -exec rm -f {} \;

          # Retry with serial build if parallel build fails
          make -j"$(nproc)" CC="ccache gcc" world || make -j1 V=s CC="ccache gcc" world

      - name: Prepare artifact bundle
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"

          if [ -d "${GITHUB_WORKSPACE}/openwrt/bin" ]; then
            tar -czf "${GITHUB_WORKSPACE}/artifacts/openwrt-${{ matrix.version }}-bin.tar.gz" -C "${GITHUB_WORKSPACE}/openwrt/bin" .
          fi

          if [ -f "${GITHUB_WORKSPACE}/openwrt/.config" ]; then
            cp "${GITHUB_WORKSPACE}/openwrt/.config" "${GITHUB_WORKSPACE}/artifacts/openwrt-${{ matrix.version }}.config"
          fi

          if [ -d "${GITHUB_WORKSPACE}/.ccache" ]; then
            tar -czf "${GITHUB_WORKSPACE}/artifacts/openwrt-${{ matrix.version }}-ccache.tar.gz" -C "${GITHUB_WORKSPACE}" .ccache
          fi

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OpenWrt build summary"
            echo ""
            echo "- Version: ${{ matrix.version }}"
            echo "- Tag: ${{ matrix.tag }}"
            echo "- Image: ${{ matrix.image }}"
            echo "- Build result: ${{ steps.build.outcome }}"
            echo ""
            if [ -d "${GITHUB_WORKSPACE}/openwrt/bin" ]; then
              echo "### Generated output"
              find "${GITHUB_WORKSPACE}/openwrt/bin" -maxdepth 2 -type f | head -n 20
            else
              echo "### Generated output"
              echo "No binary output found."
            fi
            echo ""
            echo "### Artifact bundle"
            ls -1 "${GITHUB_WORKSPACE}/artifacts" 2>/dev/null || echo "No artifacts generated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.version }}-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts/*
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "Build for ${{ matrix.version }} failed. See logs and uploaded artifacts above."
          exit 1
