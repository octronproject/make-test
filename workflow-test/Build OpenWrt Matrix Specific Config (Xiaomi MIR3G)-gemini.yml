name: Build OpenWrt Matrix Specific Config (Xiaomi MIR3G)

on:
  workflow_dispatch: # Mengaktifkan tombol manual "Run workflow" di web GitHub
  push:
    paths:
      - 'xiaomi-mir3g/fullconfig/**' # Otomatis jalan jika ada file config di folder ini yang berubah

jobs:
  build_firmware:
    name: Build OpenWrt ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Jika salah satu versi error, versi lainnya tetap jalan sampai selesai
      matrix:
        version:
          - openwrt-21.02
          - openwrt-22.03
          - openwrt-23.05
    
    # Menjalankan build di dalam container Ubuntu 20.04 khusus untuk v21.02 agar terhindar dari python error
    container: ${{ matrix.version == 'openwrt-21.02' && 'ubuntu:20.04' || null }}

    steps:
      - name: Install Git & Sudo di Container (Khusus Ubuntu Lawas/Docker v21)
        if: matrix.version == 'openwrt-21.02'
        run: |
          apt-get update
          apt-get install -y git sudo cpio

      - name: Checkout Repositori
        uses: actions/checkout@v4

      - name: Setup Lingkungan OS (Install Dependencies)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Jika berjalan langsung di runner (bukan container v21), bersihkan ruang disk
          if [ -z "${{ job.container.id }}" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          fi
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget python3

      - name: Clone Source Code OpenWrt
        run: |
          git clone -b ${{ matrix.version }} https://github.com openwrt

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Terapkan Konfigurasi Spesifik Versi
        run: |
          # Otomatis menyalin file config yang namanya cocok dengan versi matrix saat ini
          cp xiaomi-mir3g/fullconfig/${{ matrix.version }}.config openwrt/.config
          
          cd openwrt
          # Menghasilkan berkas .config utuh berbasis file konfigurasi spesifik tadi
          make defconfig

      - name: Download Source Package
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Proses Kompilasi Firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread CPU digunakan untuk compile."
          # Menggunakan opsi FORCE_UNSAFE_CONFIGURE=1 karena lingkungan Docker v21 berjalan sebagai root
          make -j$(nproc) FORCE_UNSAFE_CONFIGURE=1 || make -j1 V=s FORCE_UNSAFE_CONFIGURE=1

      - name: Kelompokkan Hasil Build
        run: |
          mkdir -p ./output
          find openwrt/bin/targets/ -type f -name "*mir3g*" -o -name "*sysupgrade*" | xargs -I {} cp {} ./output/
          echo "Daftar file hasil build yang siap diunduh:"
          ls -lh ./output

      - name: Upload Artifacts Ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ matrix.version }}-Xiaomi-MIR3G
          path: ./output/
