name: Build OpenWrt v22.03.6 Xiaomi-MIR3G

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      FORCE_UNSAFE_CONFIGURE: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

      - name: Install Prerequisites inside Container
        shell: bash
        run: |
          set -euxo pipefail

          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential clang flex g++ gawk gcc-multilib \
            git gettext libncurses5-dev libssl-dev python3-pip python3-dev \
            python3-setuptools rsync unzip zlib1g-dev swig wget file time

          if [ ! -d "${GITHUB_WORKSPACE}/openwrt" ]; then
            git clone https://github.com/openwrt/openwrt.git "${GITHUB_WORKSPACE}/openwrt"
          fi

          cd "${GITHUB_WORKSPACE}/openwrt"
          git fetch --all --tags --force
          git checkout v22.03.6

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cp "${GITHUB_WORKSPACE}/xiaomi-mir3g/fullconfig/openwrt-v22.03.6/.config" "${GITHUB_WORKSPACE}/openwrt/.config"
          cp "${GITHUB_WORKSPACE}/xiaomi-mir3g/fullconfig/openwrt-v22.03.6/mt7621.mk" "${GITHUB_WORKSPACE}/openwrt/target/linux/ramips/image/mt7621.mk"
          cp "${GITHUB_WORKSPACE}/xiaomi-mir3g/fullconfig/openwrt-v22.03.6/mt7621_xiaomi_mi-router-3g.dts" "${GITHUB_WORKSPACE}/openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts"

          export FORCE_UNSAFE_CONFIGURE=1
          make defconfig
          make download -j"$(nproc)"
          find dl -size 0 -exec rm -f {} \;
          make -j"$(nproc)" world || make -j1 V=s world

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_22.03.6_MIR3G_${{ env.BUILD_DATE }}
          path: ${{ github.workspace }}/openwrt/bin
